
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 750px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #3346cc;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .language-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        select {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .swap-btn {
            background: #eef0ff;
            color: #3346cc;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .text-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .text-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 180px;
            resize: vertical;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1.5;
        }

        textarea:focus, select:focus {
            outline: 2px solid #7585ff;
            border-color: #3346cc;
        }

        .counter {
            text-align: right;
            color: #777;
            font-size: 12px;
        }

        .translate-btn {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            background: #3346cc;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.88;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 7px;
            background: #eef0ff;
            color: #3346cc;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            color: #555;
            min-height: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .text-row {
                grid-template-columns: 1fr;
            }

            textarea {
                height: 130px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Language Translator</h1>
        <p class="subtitle">Translate text into your preferred language</p>

        <div class="language-row">
            <select id="sourceLang" aria-label="Source language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="ja">Japanese</option>
                <option value="zh-CN">Chinese (Simplified)</option>
                <option value="ar">Arabic</option>
                <option value="bn">Bengali</option>
                <option value="ta">Tamil</option>
                <option value="mr">Marathi</option>
            </select>

            <button class="swap-btn" id="swapBtn"
                    title="Swap languages" aria-label="Swap languages">
                ⇄
            </button>

            <select id="targetLang" aria-label="Target language">
                <option value="hi">Hindi</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="ja">Japanese</option>
                <option value="zh-CN">Chinese (Simplified)</option>
                <option value="ar">Arabic</option>
                <option value="bn">Bengali</option>
                <option value="ta">Tamil</option>
                <option value="mr">Marathi</option>
            </select>
        </div>

        <div class="text-row">
            <div class="text-box">
                <label for="inputText">Enter text</label>
                <textarea id="inputText"
                    maxlength="5000"
                    placeholder="Type something to translate..."
                ></textarea>
                <div class="counter" id="counter">0 / 5000</div>
            </div>

            <div class="text-box">
                <label for="outputText">Translated text</label>
                <textarea id="outputText"
                    placeholder="Translation will appear here..."
                    readonly
                ></textarea>

                <div class="actions">
                    <button id="copyBtn">Copy text</button>
                    <button id="speakBtn">🔊 Listen</button>
                </div>
            </div>
        </div>

        <button class="translate-btn" id="translateBtn">
            Translate Text
        </button>

        <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
        const inputText = document.getElementById("inputText");
        const outputText = document.getElementById("outputText");
        const sourceLang = document.getElementById("sourceLang");
        const targetLang = document.getElementById("targetLang");
        const translateBtn = document.getElementById("translateBtn");
        const status = document.getElementById("status");

        inputText.addEventListener("input", () => {
            document.getElementById("counter").textContent =
                `${inputText.value.length} / 5000`;
        });

        // Translate text using the MyMemory API
        translateBtn.addEventListener("click", async () => {
            const text = inputText.value.trim();

            if (!text) {
                status.textContent = "Please enter some text first.";
                inputText.focus();
                return;
            }

            if (sourceLang.value === targetLang.value) {
                outputText.value = text;
                status.textContent = "Both languages are the same.";
                return;
            }

            translateBtn.disabled = true;
            translateBtn.textContent = "Translating...";
            status.textContent = "Please wait...";
            outputText.value = "";

            try {
                const url =
                    "https://api.mymemory.translated.net/get?q=" +
                    encodeURIComponent(text) +
                    "&langpair=" +
                    encodeURIComponent(
                        sourceLang.value + "|" + targetLang.value
                    );

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Translation service is unavailable.");
                }

                const data = await response.json();

                if (data.responseStatus !== 200) {
                    throw new Error(
                        data.responseDetails || "Translation failed."
                    );
                }

                outputText.value =
                    data.responseData.translatedText;

                status.textContent = "Translation completed!";
            } catch (error) {
                status.textContent =
                    "Unable to translate. Check your internet connection " +
                    "and try again.";
                console.error(error);
            } finally {
                translateBtn.disabled = false;
                translateBtn.textContent = "Translate Text";
            }
        });

        // Swap source and target languages
        document.getElementById("swapBtn").addEventListener("click", () => {
            const oldSource = sourceLang.value;
            sourceLang.value = targetLang.value;
            targetLang.value = oldSource;

            if (outputText.value) {
                const oldInput = inputText.value;
                inputText.value = outputText.value;
                outputText.value = oldInput;

                document.getElementById("counter").textContent =
                    `${inputText.value.length} / 5000`;
            }

            status.textContent = "";
        });

        // Copy translated text
        document.getElementById("copyBtn").addEventListener("click",
            async () => {
                if (!outputText.value) {
                    status.textContent = "Nothing to copy.";
                    return;
                }

                try {
                    await navigator.clipboard.writeText(outputText.value);
                    status.textContent = "Translated text copied!";
                } catch {
                    outputText.select();
                    const copied = document.execCommand("copy");
                    status.textContent = copied
                        ? "Translated text copied!"
                        : "Please select and copy the text manually.";
                }
            }
        );

        // Read translated text aloud
        document.getElementById("speakBtn").addEventListener("click", () => {
            if (!outputText.value) {
                status.textContent = "Translate some text first.";
                return;
            }

            if (!("speechSynthesis" in window)) {
                status.textContent = "Text-to-speech is not supported.";
                return;
            }

            window.speechSynthesis.cancel();

            const speech = new SpeechSynthesisUtterance(
                outputText.value
            );

            const languageCodes = {
                en: "en-US",
                hi: "hi-IN",
                es: "es-ES",
                fr: "fr-FR",
                de: "de-DE",
                ja: "ja-JP",
                "zh-CN": "zh-CN",
                ar: "ar-SA",
                bn: "bn-BD",
                ta: "ta-IN",
                mr: "mr-IN"
            };

            speech.lang = languageCodes[targetLang.value] || targetLang.value;
            window.speechSynthesis.speak(speech);
        });
    </script>
</body>
</html>
